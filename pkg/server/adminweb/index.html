<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>link_chat 管理后台</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="live.css">
<script src="app.js" defer></script>
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="login-card" autocomplete="on">
    <h1>link_chat <span>管理后台</span></h1>
    <label>用户名<input name="username" autocomplete="username" required></label>
    <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
    <p id="login-error" class="error" role="alert"></p>
    <button type="submit">登录</button>
    <p class="hint">使用聊天账号登录。只有被授予管理权限的账号可以进入。</p>
  </form>
</div>

<div id="shell" class="shell" hidden>
  <aside id="rail" class="rail" aria-label="快捷导航">
    <button id="menu" class="rail-key" type="button" aria-expanded="false" aria-controls="drawer"><i class="rail-icon menu" aria-hidden="true"></i>菜单</button>
    <nav id="rail-nav" class="rail-nav" aria-label="工作区"></nav>
    <button id="account" class="rail-key rail-account" type="button" aria-expanded="false" aria-controls="drawer"><i class="rail-icon account" aria-hidden="true"></i>账户</button>
  </aside>
  <div id="drawer-scrim" class="drawer-scrim" aria-hidden="true" inert></div>
  <section id="drawer" class="drawer" aria-label="后台菜单" inert>
    <header class="drawer-head"><span class="brand">link_chat</span><button id="close-menu" class="secondary" type="button" aria-label="收起菜单">×</button></header>
    <nav id="nav" class="nav" aria-label="后台功能"></nav>
    <footer id="account-panel" class="drawer-account">
      <span id="me"></span><button id="logout" type="button" class="secondary">退出后台</button>
    </footer>
  </section>
  <header class="top">
    <span id="area" class="area"></span>
    <span id="live" class="connection" role="status" data-state="connecting">正在连接</span>
  </header>
  <main id="view" class="workspace" tabindex="-1"></main>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<dialog id="modal" class="modal" aria-labelledby="modal-title">
  <form method="dialog" id="modal-form">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <p id="modal-error" class="error" role="alert"></p>
    <div class="actions">
      <button value="cancel" class="secondary" formnovalidate>取消</button>
      <button value="ok" id="modal-ok">确定</button>
    </div>
  </form>
</dialog>
</body>
</html>
